
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Blind Date</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <main class="auth-container">
    <a href="index.html" class="brand">BLIND DATE<span>.</span></a>

    <section class="auth-card">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Good to see you.</h1>
      <p class="subtitle">Log in to access your Blind Date account.</p>

      <form id="loginForm">
        <label>Email address</label>
        <input type="email" id="loginEmail" placeholder="Your email" required>

        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Your password" required>

        <button type="submit" id="loginButton">Log in</button>
        <p id="loginMessage" role="status"></p>
      </form>

      <p class="switch-auth">
        New here? <a href="register.html">Create an account</a>
      </p>
    </section>
  </main>
</body>
</html>
