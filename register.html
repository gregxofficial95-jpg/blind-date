
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Blind Date</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <main class="auth-container">
    <a href="index.html" class="brand">BLIND DATE<span>.</span></a>

    <section class="auth-card">
      <p class="eyebrow">YOUR NEXT CHAPTER</p>
      <h1>Create your account.</h1>
      <p class="subtitle">Meet someone new. Let fate handle the introduction.</p>

      <form id="registerForm">
        <label>Full name</label>
        <input type="text" id="fullName" placeholder="Your full name" required>

        <label>Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required>

        <label>Date of birth</label>
        <input type="date" id="dateOfBirth" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required>

        <label class="checkbox-label">
          <input type="checkbox" id="adultConsent" required>
          I confirm that I am 18 years or older.
        </label>

        <button type="submit" id="registerButton">Create account</button>
        <p id="authMessage" role="status"></p>
      </form>

      <p class="switch-auth">
        Already registered? <a href="login.html">Log in</a>
      </p>
    </section>
  </main>
</body>
</html>
